
name: Set Store Worker Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Set secrets for Chehreh Ara Store
        run: |
          printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@4 secret put ADMIN_PASSWORD --name chehreh-ara
          printf '%s' "$SESSION_SECRET" | npx --yes wrangler@4 secret put SESSION_SECRET --name chehreh-ara
          printf '%s' "$GH_TOKEN" | npx --yes wrangler@4 secret put GH_TOKEN --name chehreh-ara
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
