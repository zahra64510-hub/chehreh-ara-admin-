
name: Deploy Chehreh Ara Store

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "chehreh-ara-store-worker.js"
      - "chehreh-ara-admin-worker.js"
      - "wrangler-store.jsonc"
      - ".github/workflows/deploy-store.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Store Worker
        run: npx --yes wrangler@4 deploy --config wrangler-store.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
