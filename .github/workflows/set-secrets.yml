
name: Set Cloudflare Worker Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Set Worker secrets
        run: |
          printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@4 secret put ADMIN_PASSWORD --name frosty-scene-26cb
          printf '%s' "$SESSION_SECRET" | npx --yes wrangler@4 secret put SESSION_SECRET --name frosty-scene-26cb
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
